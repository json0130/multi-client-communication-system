[pytest]
# Scoped to the server package. The repo root holds archived v1-5 trees and a
# checked-in virtualenv, so collection must not start above this directory.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -p no:launch_testing / no:launch_ros: ~/.bashrc sources ROS 2 Humble, which
# puts ROS's pytest plugins on PYTHONPATH, and launch_testing reconfigures
# logging so caplog receives nothing — the presence-override logging tests
# then fail in any shell that sourced ROS and pass in any that did not. These
# tests do not use ROS launch testing; keep its plugins out of the run.
addopts = -q --strict-markers -p no:launch_testing -p no:launch_ros
markers =
    integration: exercises more than one layer (still no network or database)
    allow_db: opt out of the no_network guard (should be rare)
filterwarnings =
    ignore::DeprecationWarning
