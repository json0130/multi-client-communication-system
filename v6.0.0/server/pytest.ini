[pytest]
# Scoped to the server package. The repo root holds archived v1-5 trees and a
# checked-in virtualenv, so collection must not start above this directory.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    integration: exercises more than one layer (still no network or database)
    allow_db: opt out of the no_network guard (should be rare)
filterwarnings =
    ignore::DeprecationWarning
