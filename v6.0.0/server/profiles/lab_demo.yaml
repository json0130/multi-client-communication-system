# CARES lab demo — scenario profile
#
# Declares each robot's Social Identity for this deployment: role, and the RBAC
# access level that governs what it can retrieve from the memory layer.
#
# Loaded and validated at boot by core.profiles.ProfileRegistry, which then
# reconciles robots.access_level / robots.scenario_id in Supabase. Access
# hierarchies are therefore adjustable as data, without touching robot nodes.
#
# Robot IDs must match client_id in each robot's client_config.json, and the
# constants at the top of demo/demo_script.py.
#
# Keys are documented in v6.0.0/README.md under "Scenario Profiles".

scenario_id: lab_demo
description: >
  CARES lab tour. Pepper guides visitors and delegates project questions to the
  specialist robots, each of which speaks only to its own research area.

# Each project robot is at its own station in the lab. The group stands with
# whichever robot is presenting (and Pepper, who walks with them), so any
# other project robot is out of reach: a question for it is deferred to its
# station if the tour is still going there, otherwise Pepper answers it.
separate_stations: true

robots:
  # Main guide. Manager: cross-client visibility over global records within this
  # scenario, so it can maintain a unified view of the visitor across the team.
  # Previously described in demo_script.py as "full DB access".
  - id: pepper_01
    role: "Guide"
    access_level: global

  # importance: how much this project matters to the LAB, independent of any
  # visitor. It is the planner's first layer and the ONLY thing that decides
  # which block gets cut when nobody has stated an interest.
  #
  # Set by the lab, 2026-09-10, in the order a rushed visitor should keep
  # them: conversational AI first, human-aware navigation second,
  # emotion-aware interaction last to be protected. Values are spaced 0.2
  # apart so a single stated visitor interest (worth ~0.39 in
  # check_cold_start) can still reorder them — a lab priority is the standing
  # default, not an override of what the visitor in the room actually asked
  # for.
  #
  # These were all 0.5 before, which is the same as unset: equal values tie
  # and the planner's (importance, robot_id) sort falls through to the
  # alphabet, so a project was cut because of how its client_id is spelled.
  # `python3 tools/check_cold_start.py` reported it as INERT.
  #
  # Specialist robots. Workers: local isolation — each retrieves only its own
  # interaction history and cannot read what another platform generated.
  #
  # default_visibility: global means the records they write are readable by the
  # Manager, which is what gives Pepper its unified view. It does not widen what
  # these robots can read — that is governed by access_level alone.
  - id: chatbox_01
    role: "Conversational AI researcher"
    access_level: local
    default_visibility: global
    importance: 0.8

  - id: navel_01
    role: "Emotion-aware interaction researcher"
    access_level: local
    default_visibility: global
    importance: 0.4

  # The physical Navel (navel_client/client_config.json). navel_01 above stays
  # the lab-demo/Gazebo test id; both are the same robot as far as the
  # scenario is concerned, so they share role, access and importance.
  - id: navel_001
    role: "Emotion-aware interaction researcher"
    access_level: local
    default_visibility: global
    importance: 0.4

  - id: silbot_01
    role: "Human-aware navigation researcher"
    access_level: local
    default_visibility: global
    importance: 0.6
